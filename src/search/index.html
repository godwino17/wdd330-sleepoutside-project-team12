<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Search</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/search.js" type="module"></script>
  </head>

  <body>
    <header class="divider">
      <div class="logo">
        <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
        <a href="/index.html"> Sleep<span class="highlight">Outside</span></a>
      </div>

      <form class="search-form" action="/search/index.html" method="get">
        <input
          type="search"
          name="q"
          placeholder="Search products…"
          aria-label="Search products"
          required
        />
        <button type="submit" aria-label="Search">🔍</button>
      </form>

      <div class="cart">
        <div class="number" id="number">
          <a id="amount" href="/cart/index.html">0</a>
        </div>
        <a href="/cart/index.html">
          <div class="cart">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
              <!-- keep your existing tent SVG here -->
            </svg>
          </div>
        </a>
      </div>
    </header>

    <main class="divider">
      <section class="products">
        <h2 id="searchTitle">Search</h2>
        <ul class="product-list"></ul>
      </section>
    </main>

    <footer>&copy;NOT a real business</footer>
  </body>
</html>
