<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Orders</title>

    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/orders.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header">
      <div class="logo">
        <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
        <a href="/index.html"> Sleep<span class="highlight">Outside</span></a>
      </div>
      <button type="button" id="logout-btn" class="logout-btn">Log out</button>

    <main class="divider">
      <section class="orders">
        <h1>Incoming Orders</h1>

        <div id="orders-status" class="orders__status" role="status"></div>

        <table class="orders-table" id="orders-table" hidden>

            <tr>
              <th>Order #</th>
              <th>Customer</th>
              <th>Date</th>
              <th>Items</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="orders-body"></tbody>
        </table>
      </section>
    </main>

    <footer id="main-footer">&copy;NOT a real business</footer>
