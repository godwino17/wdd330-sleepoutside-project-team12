<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="js/main.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>
    <main class="divider">
      <div class="hero">
        <img
          src="/images/banner-sm.jpg"
          srcset="images/banner-sm.jpg 500w, images/banner.jpg"
          alt="image of a high mountain lake"
        />
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>

      <section class="products">
        <h2>Products Categories</h2>
        <div class="product-category">
          <a href="./product_listing/index.html?category=tents">
            <figure>
              <img src="https://byui-cse.github.io/wdd330-ww-course/images/category-tents.svg" alt="Tent logo" width="50" height="50">
              <figcaption>Tents</figcaption>
            </figure>
          </a>
          <a href="./product_listing/index.html?category=backpacks">
            <figure>
              <img src="https://byui-cse.github.io/wdd330-ww-course/images/category-backpacks.svg" alt="Backpack logo" width="50" height="50">
              <figcaption>Backpacks</figcaption>
            </figure>
          </a>
          <a href="./product_listing/index.html?category=sleeping-bags">
            <figure>
              <img src="https://byui-cse.github.io/wdd330-ww-course/images/category-sleepingbags.svg" alt="Sleeping bags logo" width="50" height="50">
              <figcaption>Sleeping Bags</figcaption>
            </figure>
          </a>
          <a href="./product_listing/index.html?category=hammocks">
            <figure>
              <img src="https://byui-cse.github.io/wdd330-ww-course/images/category-hammocks.svg" alt="Hammock logo" width="50" height="50">
              <figcaption>Hammocks</figcaption>
            </figure>
          </a>
        </div>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
